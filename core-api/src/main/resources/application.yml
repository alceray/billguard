server:
  port: ${PORT:3001}
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never

spring:
  application:
    name: billguard-core-api
  threads:
    virtual:
      enabled: true
  lifecycle:
    timeout-per-shutdown-phase: 25s
  datasource:
    url: jdbc:postgresql://${DATABASE_HOST:localhost}:${DATABASE_PORT:5432}/${DATABASE_NAME:billguard}
    username: ${DATABASE_USER:billguard}
    password: ${DATABASE_PASSWORD}
    hikari:
      # Keep /ready within the Kubernetes probe's five-second timeout.
      connection-timeout: 3000
      validation-timeout: 2000
  flyway:
    enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://${AUTH0_DOMAIN}/
          audiences:
            - ${AUTH0_AUDIENCE}
  web:
    resources:
      add-mappings: false

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

logging:
  level:
    dev.billguard: ${LOG_LEVEL:info}

app:
  frontend-url: ${FRONTEND_URL:http://localhost:5173}

billguard:
  encryption:
    key: ${TOKEN_ENCRYPTION_KEY:}
  plaid:
    env: ${PLAID_ENV:sandbox}
    client-id: ${PLAID_CLIENT_ID:}
    secret: ${PLAID_SECRET:}
    webhook-url: ${PLAID_WEBHOOK_URL:}
    products: ${PLAID_PRODUCTS:transactions}
    country-codes: ${PLAID_COUNTRY_CODES:US}
    base-url: ${PLAID_BASE_URL:}
  worker:
    enabled: ${BILLGUARD_WORKER_ENABLED:false}
    poll-delay: ${BILLGUARD_WORKER_POLL_DELAY:2000}
    batch-size: ${BILLGUARD_WORKER_BATCH_SIZE:10}
    stale-after: ${BILLGUARD_WORKER_STALE_AFTER:PT10M}
