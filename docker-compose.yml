# Local development fallback - use kind as the primary cluster environment.
# This exists for quick iteration without a cluster.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: billguard
      POSTGRES_USER: billguard
      POSTGRES_PASSWORD: billguard_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U billguard -d billguard"]
      interval: 5s
      timeout: 5s
      retries: 5

  core-api:
    env_file:
      - ./.env
    build:
      context: ./core-api
    environment:
      SPRING_PROFILES_ACTIVE: dev
      PORT: 3001
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: billguard
      DATABASE_USER: billguard
      DATABASE_PASSWORD: billguard_dev
      LOG_LEVEL: debug
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy

  ai-service:
    env_file:
      - ./.env
    build:
      context: ./ai-service
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      APP_ENV: dev
      LOG_LEVEL: debug
    ports:
      - "8000:8000"
    volumes:
      - ./ai-service/app:/app/app:ro

volumes:
  postgres_data:
