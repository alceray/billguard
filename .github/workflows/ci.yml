name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  core-api:
    name: Core API - verify
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - run: ./mvnw -B verify

  ai-service:
    name: AI service - lint, typecheck & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-service
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.12.0"
          enable-cache: true
          cache-dependency-glob: ai-service/uv.lock
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run mypy app
      - run: uv run pytest

  web-app:
    name: Web app - check & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web-app/package-lock.json
      - run: npm ci
      - run: npm run check
      # VITE_* vars are required at build time; use placeholders for CI.
      - run: npm run build
        env:
          VITE_AUTH0_DOMAIN: ci.auth0.com
          VITE_AUTH0_CLIENT_ID: ci-client-id
          VITE_AUTH0_AUDIENCE: https://api.billguard.dev
          VITE_API_URL: http://localhost:3001

