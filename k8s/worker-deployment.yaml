apiVersion: apps/v1
kind: Deployment
metadata:
  name: billguard-worker
  namespace: billguard-dev
  labels:
    app.kubernetes.io/name: billguard-worker
    app.kubernetes.io/component: worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: billguard-worker
  # CKAD: RollingUpdate replaces the pull-based worker without exposing a Service.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: billguard-worker
        app.kubernetes.io/name: billguard-worker
    spec:
      terminationGracePeriodSeconds: 30
      # CKAD: the initContainer prevents queue polling before Postgres is reachable.
      initContainers:
        - name: wait-for-db
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z postgres-service 5432; do sleep 2; done"]
          resources:
            requests:
              cpu: "10m"
              memory: "16Mi"
            limits:
              cpu: "50m"
              memory: "32Mi"
      containers:
        - name: worker
          image: billguard-core-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: health
              containerPort: 3001
          envFrom:
            - configMapRef:
                name: billguard-config
            - secretRef:
                name: billguard-secrets
          env:
            - name: BILLGUARD_WORKER_ENABLED
              value: "true"
          # The worker has no request burst profile, but retains JVM and sync-page headroom.
          resources:
            requests:
              cpu: "150m"
              memory: "320Mi"
            limits:
              cpu: "750m"
              memory: "640Mi"
          # CKAD: health probes keep the worker observable even though it has no Service.
          livenessProbe:
            httpGet:
              path: /health
              port: health
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /health
              port: health
            periodSeconds: 5
            failureThreshold: 24
