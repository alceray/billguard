apiVersion: apps/v1
kind: Deployment
metadata:
  name: billguard-ai-service
  namespace: billguard-dev
  labels:
    app.kubernetes.io/name: billguard-ai-service
    app.kubernetes.io/component: ai
    app.kubernetes.io/version: "0.1.0"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: billguard-ai-service
  # CKAD: rolling update keeps the internal classifier available during deploys.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: billguard-ai-service
        app.kubernetes.io/name: billguard-ai-service
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: ai-service
          image: billguard-ai-service:latest # Replaced by CI with an ECR digest.
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          # CKAD: envFrom supplies model mode and future provider credentials.
          envFrom:
            - configMapRef:
                name: billguard-config
            - secretRef:
                name: billguard-secrets
          # Phase 1 is a lightweight stub; Phase 3 will profile model workloads.
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          # CKAD: liveness checks the process only.
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
            failureThreshold: 3
            timeoutSeconds: 5
          # CKAD: readiness will include LLM reachability when inference lands.
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
            failureThreshold: 3
            timeoutSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: billguard-ai-service
  namespace: billguard-dev
  labels:
    app.kubernetes.io/name: billguard-ai-service
    app.kubernetes.io/component: ai
spec:
  selector:
    app: billguard-ai-service
  ports:
    - name: http
      port: 8000
      targetPort: http
  type: ClusterIP
