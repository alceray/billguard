apiVersion: apps/v1
kind: Deployment
metadata:
  name: billguard-core-api
  namespace: billguard-dev
  labels:
    app.kubernetes.io/name: billguard-core-api
    app.kubernetes.io/component: api
    app.kubernetes.io/version: "0.1.0"
  annotations:
    # Populated by CI on deploy.
    deployment.kubernetes.io/revision: "1"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: billguard-core-api
  # CKAD: rolling update keeps at least the current replica count available.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: billguard-core-api
        app.kubernetes.io/name: billguard-core-api
    spec:
      terminationGracePeriodSeconds: 30
      # CKAD: initContainer waits for the database before Flyway starts.
      initContainers:
        - name: wait-for-db
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z postgres-service 5432; do
                echo "Waiting for postgres..."; sleep 2;
              done
              echo "Postgres is ready"
          resources:
            requests:
              cpu: "10m"
              memory: "16Mi"
            limits:
              cpu: "50m"
              memory: "32Mi"
      containers:
        - name: api
          image: billguard-core-api:latest # Replaced by CI with an ECR digest.
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3001
          # CKAD: envFrom separates non-secret configuration from credentials.
          envFrom:
            - configMapRef:
                name: billguard-config
            - secretRef:
                name: billguard-secrets
          # Initial JVM envelope; tighten after measuring Java 25 RSS and startup.
          resources:
            requests:
              cpu: "250m"
              memory: "384Mi"
            limits:
              cpu: "1000m"
              memory: "768Mi"
          # CKAD: liveness restarts a wedged process without depending on Postgres.
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            failureThreshold: 3
            timeoutSeconds: 5
          # CKAD: readiness removes a replica if its database check fails.
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
            timeoutSeconds: 5
          # CKAD: startup allows cold JVM startup plus Flyway up to 120 seconds.
          startupProbe:
            httpGet:
              path: /health
              port: http
            failureThreshold: 24
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: billguard-core-api-service
  namespace: billguard-dev
  labels:
    app.kubernetes.io/name: billguard-core-api
    app.kubernetes.io/component: api
spec:
  selector:
    app: billguard-core-api
  ports:
    - name: http
      port: 80
      targetPort: http
  type: ClusterIP
