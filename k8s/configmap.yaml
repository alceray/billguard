# Non-sensitive configuration, safe to commit.
# Sensitive values (API keys, DB passwords) go in secrets.yaml (git-ignored).
apiVersion: v1
kind: ConfigMap
metadata:
  name: billguard-config
  namespace: billguard-dev
  labels:
    app.kubernetes.io/name: billguard
    app.kubernetes.io/component: config
data:
  SPRING_PROFILES_ACTIVE: "prod"
  APP_ENV: "prod"
  PORT: "3001"
  LOG_LEVEL: "info"
  LOCAL_LLM_MODE: "true"
  AI_SERVICE_URL: "http://billguard-ai-service:8000"
  OLLAMA_BASE_URL: "http://localhost:11434"
  OLLAMA_MODEL: "gemma3:1b"
  # Unload after each batch to return memory on the small single-node cluster.
  OLLAMA_KEEP_ALIVE: "0"
  PLAID_ENV: "sandbox"
  PLAID_PRODUCTS: "transactions"
  PLAID_COUNTRY_CODES: "US"
  # Replace with the public ingress/tunnel URL for webhook delivery.
  PLAID_WEBHOOK_URL: "https://REPLACE_ME/api/webhooks/plaid"
  BILLGUARD_WORKER_ENABLED: "false"
  # Updated per environment - dev points to in-cluster Postgres
  DATABASE_HOST: "postgres-service"
  DATABASE_PORT: "5432"
  DATABASE_NAME: "billguard"
